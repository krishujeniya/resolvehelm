services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      # Securely bind only to loopback interface on host
      - "127.0.0.1:8080:8000"
    env_file:
      - .env
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  poller:
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run python -m app.poller
    env_file:
      - .env
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
