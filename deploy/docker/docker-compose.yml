services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8000"
    env_file:
      - path: ../../.env
        required: false
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  poller:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: uv run python -m app.poller
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: ../../.env
        required: false
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
